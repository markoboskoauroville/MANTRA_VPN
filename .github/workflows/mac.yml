# TEMPLATE mac-swift.yml from MANTRA_MANIFEST/workflows (source: G815_LIGHTS build.yml). Changed: APP, VERSION_FILE, the
# app lives in mac/, and the release step tolerates the Android workflow creating release vN at the same moment (both
# sides ship in ONE release vN: app.zip for the Mac, the .apk for the phone; the number is the same on both sides).
name: Mac app
on:
  push:
    branches: [main]
    paths: ["mac/**", ".github/workflows/mac.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  APP: "VPN (Mantra)"
  VERSION_FILE: mac/Sources/Version.swift
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: SIGN=- NO_INSTALL=1 ./mac/build.sh
      - name: Pack
        run: cd mac/build && ditto -c -k --keepParent "$APP.app" app.zip
      - name: Release (Latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(sed -n 's/^let VERSION = \([0-9]*\)/\1/p' "$VERSION_FILE")
          if gh release view "v$V" >/dev/null 2>&1; then gh release upload "v$V" mac/build/app.zip --clobber
          else gh release create "v$V" mac/build/app.zip --target "$GITHUB_SHA" --latest --title "$APP v$V" --notes "$(git log -1 --format=%s)" \
               || gh release upload "v$V" mac/build/app.zip --clobber; fi
